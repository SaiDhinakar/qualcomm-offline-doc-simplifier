[project]
name = "qualcomm-offline-doc-simplifier"
version = "0.1.0"
description = "Offline, on-device document simplifier for legal/financial documents"
readme = "README.md"
authors = [{ name = "SaiDhinakar", email = "saidhinakars899@gmail.com" }]
keywords = [
    "document-simplification",
    "ocr",
    "rag",
    "offline",
    "snapdragon",
    "qualcomm-ai-hub",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    # OCR & layout
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",

    # Numerics / vector search
    "numpy>=1.24.0",

    # CLI
    "click>=8.1.0",

    # Data models
    "pydantic>=2.0.0",

    # Testing
    "pytest>=7.0.0",
]

[project.optional-dependencies]
# Local LLM via Ollama HTTP API (no compile step) — preferred over llama-cpp-python
ollama = []
# Real semantic embeddings without torch
embed = ["fastembed>=0.8.0"]
# PaddleOCR fallback for missing Tesseract language packs (Hindi etc.)
paddle = ["paddlepaddle>=3.0.0", "paddleocr>=3.0.0"]
# Qualcomm AI Hub cloud device jobs
qai = ["qai-hub>=0.55.0", "qai-hub-models>=0.62.0"]
# Optional torch-based backends
ai = [
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
    "llama-cpp-python>=0.3.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
qds = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
